name: publish-cook

# QA-11-23-b row 49 (J505): a cook that outlasts publish.yml's cook job still gets its pin. Big shards' cooks run long
# (Pine's 45 to 52 minutes, A6), and Driftwood's run 45384751206 ended red on a stalled upload whose cook went on, so
# the pin was left to a hand. publish.yml's cook job, past its wait, dispatches this workflow; it waits on, asks engine
# for the pin when the verdict lands, and hands itself on again until its last hop (6 x 100 minutes, about 10 hours).
# A refusal ends it red. When the publish names its version and built commit, `record` then tags that commit and
# commits published.json, as publish.yml's own record job does (row 50; a repo whose script has no `record` skips it). Kit-owned (repo-kit files/): edit it there, never in a shard repo. By hand:
#   gh workflow run publish-cook.yml -R project-wildshard/shard-nalati -f slug=<slug> -f channel=staging -f hash=<hash> \
#     -f upload_id=<upload id>
on:
  workflow_dispatch:
    inputs:
      slug:
        description: The slug the upload holds
        type: string
        required: true
      channel:
        description: The publish channel
        type: choice
        options: [staging, prod]
        default: staging
      hash:
        description: The uploaded shard file's sha256
        type: string
        required: true
      upload_id:
        description: The accepted upload's id (empty when it was live at commit)
        type: string
        default: ''
      hop:
        description: Which hand-off this is (the last, 6, refuses at its deadline)
        type: number
        default: 1
      version:
        description: The version the upload holds, for published.json (empty skips the record)
        type: string
        default: ''
      built:
        description: The commit the shard file was built from, which the record tags
        type: string
        default: ''

permissions:
  contents: read
  actions: write

# One wait per upload.
concurrency:
  group: publish-cook-${{ inputs.slug }}-${{ inputs.hash }}
  cancel-in-progress: false

jobs:
  cook:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: ${{ inputs.channel }}
    outputs:
      revision: ${{ steps.report.outputs.revision }}
    env:
      SLUG: ${{ inputs.slug }}
      CHANNEL: ${{ inputs.channel }}
      HASH: ${{ inputs.hash }}
      UPLOAD_ID: ${{ inputs.upload_id }}
      HOP: ${{ inputs.hop }}
      VERSION: ${{ inputs.version }}
      BUILT: ${{ inputs.built }}
      NIGHTLY_APP_CLIENT_ID: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
      PUBLISH_COOK_HANDOFF: ${{ inputs.hop < 6 && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.node-version
            /scripts/
            /package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Wait for the cook's verdict and staging's revision
        id: report
        run: node src/scripts/.kit/publish-shard.mjs cook "$SLUG" "$CHANNEL" "$HASH" "$UPLOAD_ID"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: nightly
        if: env.NIGHTLY_APP_CLIENT_ID != '' && steps.report.outputs.revision != ''
        with:
          client-id: ${{ env.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: project-wildshard
          repositories: engine
          permission-contents: write
      # Meta QA 11-25 row 61: shard repos hold no nightly key (by design), so the request above is skipped; say so.
      - name: Say who pins this revision
        if: steps.nightly.outputs.token == '' && steps.report.outputs.revision != ''
        env:
          REVISION: ${{ steps.report.outputs.revision }}
        run: |
          echo "::notice::no nightly app key here: engine's shard-sweep.yml starts the pin for $SLUG r$REVISION within 20 minutes"
          echo "engine's shard-sweep starts the pin for $SLUG r$REVISION (this repo holds no nightly key)" >> "$GITHUB_STEP_SUMMARY"
      - name: Ask engine for the pin bump
        if: steps.nightly.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.nightly.outputs.token }}
          REVISION: ${{ steps.report.outputs.revision }}
        run: |
          gh api repos/project-wildshard/engine/dispatches -f event_type=shard-published \
            -F "client_payload[slug]=$SLUG" -F "client_payload[revision]=$REVISION" \
            -F "client_payload[hash]=$HASH" -F "client_payload[channel]=$CHANNEL"
          echo "engine shard-pin dispatched for $SLUG rev $REVISION (hop $HOP)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait on in a fresh run
        if: steps.report.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-cook.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f slug="$SLUG" -f channel="$CHANNEL" -f hash="$HASH" -f upload_id="$UPLOAD_ID" -f hop="$((HOP + 1))" \
            -f version="$VERSION" -f built="$BUILT"
          echo "the cook goes on in publish-cook.yml (hop $((HOP + 1)))" >> "$GITHUB_STEP_SUMMARY"

  # QA-11-23-b row 50: the record publish.yml's own record job would have written (SHARD-COMPAT CP13).
  record:
    needs: cook
    if: ${{ needs.cook.outputs.revision != '' && inputs.version != '' && inputs.built != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SLUG: ${{ inputs.slug }}
      VERSION: ${{ inputs.version }}
      REVISION: ${{ needs.cook.outputs.revision }}
      HASH: ${{ inputs.hash }}
      CHANNEL: ${{ inputs.channel }}
      BUILT: ${{ inputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Tag the built commit and commit published.json
        id: record
        run: |
          if ! grep -q "command === 'record'" src/scripts/.kit/publish-shard.mjs; then
            echo "this repo's publish-shard.mjs records nothing; skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node src/scripts/.kit/publish-shard.mjs record "$SLUG" "$VERSION" "$REVISION" "$HASH" "$CHANNEL" "$BUILT"
          tag=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Meta QA 11-25 row 61: GITHUB_TOKEN may not push a tag onto a commit whose workflows differ from main's (a
          # kit sync mid-run, Pine r18). published.json still lands; engine's shard-sweep.yml tags it with the nightly app.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$BUILT"
            if ! git push origin "refs/tags/$tag"; then
              echo "::notice::tag $tag was refused here; engine's shard-sweep.yml tags it from published.json"
              echo "tag $tag: refused to this token; engine's shard-sweep tags it" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          git add published.json
          if git diff --cached --quiet; then
            echo "published.json already records $SLUG rev $REVISION"
          else
            git commit -m "chore(publish): $SLUG $VERSION r$REVISION on $CHANNEL" -m "SHARD-COMPAT CP13: recorded by publish-cook.yml run $GITHUB_RUN_ID."
            git push origin HEAD || { git pull --rebase origin HEAD && git push origin HEAD; }
          fi
          echo "$SLUG $VERSION: tag $tag, published.json on main" >> "$GITHUB_STEP_SUMMARY"
