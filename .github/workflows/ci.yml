name: ci
run-name: ${{ inputs.ci21_source && format('CI21 source originals, engine {0}', inputs.engine) || 'ci' }}

on:
  push:
    branches: [main, 'plan/**']
  pull_request:
  workflow_dispatch:
    inputs:
      ci21_source:
        description: Run only the exact-source CI21 test proof (product rollout remains C11)
        type: boolean
        default: false
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
      sharddev:
        description: Exact candidate sharddev commit (empty keeps the pin)
        type: string
        default: ''
  repository_dispatch:
    types: [engine-candidate]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.engine || github.event.client_payload.engine }}-${{ inputs.sharddev || github.event.client_payload.sharddev }}-${{ inputs.ci21_source || false }}
  # A newer push to a plan branch cancels its older run; land reads a
  # cancelled run as red and stops, so push a plan branch only via land.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/plan/') }}

jobs:
  # Pinned/product jobs and full Ring 3 dispatch keep all existing gates.
  # C3 source proof never stands in for C11 product compatibility.
  check:
    name: ${{ inputs.ci21_source && 'product (not requested)' || 'check' }}
    if: inputs.ci21_source != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact Ring 3 candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Match the candidate engine's declared format dependency
        if: inputs.engine != '' || github.event.client_payload.engine != ''
        run: |
          node scripts/candidate-format.mjs
          pnpm install --no-frozen-lockfile --config.ci=false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/npm-bin-deps
          key: npr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bin-deps/package.json', '.bin-deps/package-lock.json') }}
      - run: pnpm exec npr install --frozen
      - run: node kit/scripts/bin-pins.mjs
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      # The agent hook scripts are shellchecked in pnpm check, at this exact
      # version (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      # MR6: hosted runners are Linux/X64, the Mac mini's VM is Linux/ARM64;
      # each archive is pinned by its own published sha256.
      - name: Install shellcheck 0.11.0
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) arch=x86_64 sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Linux/ARM64) arch=aarch64 sum=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            *) echo "::error::no pinned shellcheck 0.11.0 for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.xz"
          echo "$sum  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: pnpm check
      - name: Retain CI21 owned map input assertions
        run: |
          mkdir -p tmp/ci21-map
          node --test test/ci21-map-owner.test.mjs > tmp/ci21-map/raw.tap
          cat tmp/ci21-map/raw.tap
      - name: Keep actual map-input owner verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-map-owner-${{ github.run_id }}
          path: tmp/ci21-map/
          if-no-files-found: ignore
      # J440 promotes the candidate-boundary controls after the verified soaks.
      - name: Enforce candidate-boundary controls
        if: ${{ !cancelled() }}
        run: |
          mkdir -p tmp/ci21-boundary
          set +e
          pnpm test:ci21-boundary > tmp/ci21-boundary/raw.log 2>&1
          result=$?
          set -e
          cat tmp/ci21-boundary/raw.log
          printf '{"advisory":false,"exitCode":%s}\n' "$result" > tmp/ci21-boundary/result.json
          exit "$result"
      - name: Retain candidate-boundary results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci21-boundary-${{ github.run_id }}
          path: tmp/ci21-boundary/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the cleared queue and public imports honest
        run: node scripts/check-test-boundary.mjs
      - name: Native collider bytes and owned recovery
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/native-collider.test.mjs
      # The key names the C library: a basisu built on ubuntu-26.04 (glibc
      # 2.43) fails on ubuntu-24.04 (2.39), so caches never mix (repo-kit c9bbdb2).
      - name: Name the C library the Basis encoder links against
        id: libc
        run: echo "libc=$(node -p "process.report.getReport().header.glibcVersionRuntime ?? 'none'")" >> "$GITHUB_OUTPUT"
      - name: Keep the pinned Basis encoder the phone atlases need (S12f3)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/basis
          key: basis-${{ runner.os }}-${{ runner.arch }}-glibc${{ steps.libc.outputs.libc }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: basis-${{ runner.os }}-${{ runner.arch }}-glibc${{ steps.libc.outputs.libc }}-
      - name: Build shard products on the runner
        if: github.event_name != 'push'
        run: pnpm build:shards
      - name: Check the offline phone memory limit
        if: github.event_name != 'push'
        run: pnpm exec shard-format validate out/nalati-grasslands
      - name: Preserve CI21 grid eviction and restore assertions
        if: ${{ !cancelled() && (github.job != 'check' || github.event_name != 'push') }}
        run: |
          mkdir -p tmp/ci21-grid
          node --test test/ci21-grid-reentry.test.mjs > tmp/ci21-grid/raw.tap
          cat tmp/ci21-grid/raw.tap
      - name: Keep actual grid owner results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-grid-owner-${{ github.job }}-${{ github.run_id }}
          path: tmp/ci21-grid/
          if-no-files-found: ignore
      - name: Check the shard source as an author would (TS21)
        if: github.event_name != 'push'
        run: pnpm exec wildshard check . tmp/ci/check
      - name: Walk the owned 1800-tick authored route
        if: github.event_name != 'push'
        run: node --experimental-transform-types --test test/ci/owned-journey.test.mjs
      - name: Tame the plains stallion on real inputs
        if: github.event_name != 'push'
        run: node --experimental-transform-types --test test/ci/taming-journey.test.mjs
      - name: Hide in the feather grass and be seen by the herd
        if: github.event_name != 'push'
        run: node --experimental-transform-types --test test/ci/stealth-journey.test.mjs
      - name: Fell Aqbars in her lair on real inputs
        if: github.event_name != 'push'
        run: node --experimental-transform-types --test test/ci/aqbars-journey.test.mjs
      - if: github.event_name != 'push'
        run: pnpm test:shards
      - name: Admit complete CI21 ports against the candidate engine
        if: inputs.engine != '' || github.event.client_payload.engine != ''
        run: pnpm check:ci21-candidate
      - name: Admit the complete publishable product
        if: github.event_name != 'push'
        run: node --test test/ci/package-products.test.mjs
      - name: Prove authored wet ground and shipped navigation
        if: github.event_name != 'push'
        run: node --test test/ci/navigation-ground.test.mjs
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pnpm test:hooks
      - name: Name the commits this verdict covers
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI verdict target\n\n%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[] | select(.status == \"completed\" and .conclusion != \"cancelled\" and .id < $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished push run to compare against' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA?per_page=100" \
            --jq '.commits[] | "\(.sha[0:10]) \(.commit.message | split("\n")[0])"')
          {
            printf '\n### Included commits since %s\n\n~~~text\n%s\n~~~\n' "$previous" "$commits"
            echo 'The checks target the final tree; intermediate SHAs were not executed separately.'
          } >> "$GITHUB_STEP_SUMMARY"

  # TEST-SPEED TS16e (repo-kit docs/shard-ci.md): on a push this job builds
  # once, runs check's build-dependent steps on that out/, then plays Ring 2
  # when the push touches what ring-2-content.yml's push trigger watched.
  # ring-2-content.yml keeps the nightly run and dispatches; check still
  # builds for pull requests and candidates.
  ring-2-content:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact Ring 3 candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Match the candidate engine's declared format dependency
        if: inputs.engine != '' || github.event.client_payload.engine != ''
        run: |
          node scripts/candidate-format.mjs
          pnpm install --no-frozen-lockfile --config.ci=false
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      # The paths ring-2-content.yml's push trigger watched, plus ci.yml.
      # A plan/** push compares against main, not the branch's last tip, so
      # land never fast-forwards a branch whose watched change skipped Ring 2.
      # An unknown base (a main branch's first push, failed compare, 300+
      # files) plays.
      - name: Decide whether this push plays Ring 2
        id: ring2
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ startsWith(github.ref, 'refs/heads/plan/') && 'main' || github.event.before }}
        run: |
          watched='^(\.github/workflows/(ci|ring-2-content)\.yml$|\.github/actions/|src/|test/|scripts/|public/|lint/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$|vitest\.config\.[^/]*$|\.npmrc$|\.gitattributes$|\.oxlintrc\.author\.json$)'
          play=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') &&
            [ "$(printf '%s\n' "$files" | grep -c .)" -lt 300 ] &&
            ! printf '%s\n' "$files" | grep -Eq "$watched"; then
            play=false
          fi
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "Ring 2 play on this push: $play"
      - name: Install the headless authoring browser
        if: steps.ring2.outputs.play == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the three Nalati author commands
        if: steps.ring2.outputs.play == 'true'
        run: node --test test/ci/nalati-author-tools.test.mjs
      # The key names the C library: a basisu built on ubuntu-26.04 (glibc
      # 2.43) fails on ubuntu-24.04 (2.39), so caches never mix (repo-kit c9bbdb2).
      - name: Name the C library the Basis encoder links against
        id: libc
        run: echo "libc=$(node -p "process.report.getReport().header.glibcVersionRuntime ?? 'none'")" >> "$GITHUB_OUTPUT"
      - name: Keep the pinned Basis encoder the phone atlases need (S12f3)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/basis
          key: basis-${{ runner.os }}-${{ runner.arch }}-glibc${{ steps.libc.outputs.libc }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: basis-${{ runner.os }}-${{ runner.arch }}-glibc${{ steps.libc.outputs.libc }}-
      - name: Build shard products on the runner
        run: pnpm build:shards
      - name: Check the offline phone memory limit
        run: pnpm exec shard-format validate out/nalati-grasslands
      - name: Preserve CI21 grid eviction and restore assertions
        if: ${{ !cancelled() && (github.job != 'check' || github.event_name != 'push') }}
        run: |
          mkdir -p tmp/ci21-grid
          node --test test/ci21-grid-reentry.test.mjs > tmp/ci21-grid/raw.tap
          cat tmp/ci21-grid/raw.tap
      - name: Keep actual grid owner results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-grid-owner-${{ github.job }}-${{ github.run_id }}
          path: tmp/ci21-grid/
          if-no-files-found: ignore
      - name: Check the shard source as an author would (TS21)
        run: pnpm exec wildshard check . tmp/ci/check
      # The cook is the long pole. It reads out/ and writes only its own
      # temp folder, so it starts now beside check's steps, and the last
      # step waits for its verdict.
      - name: Start the live-herd cook beside check's steps
        if: steps.ring2.outputs.play == 'true'
        run: |
          (code=0
           node --test test/ci/cook-play.test.mjs > "$RUNNER_TEMP/cook.log" 2>&1 || code=$?
           echo "$code" > "$RUNNER_TEMP/cook.exit") &
      - name: Walk the owned 1800-tick authored route
        run: node --experimental-transform-types --test test/ci/owned-journey.test.mjs
      - name: Tame the plains stallion on real inputs
        run: node --experimental-transform-types --test test/ci/taming-journey.test.mjs
      - name: Hide in the feather grass and be seen by the herd
        run: node --experimental-transform-types --test test/ci/stealth-journey.test.mjs
      - name: Fell Aqbars in her lair on real inputs
        run: node --experimental-transform-types --test test/ci/aqbars-journey.test.mjs
      - run: pnpm test:shards
      - name: Admit the complete publishable product
        run: node --test test/ci/package-products.test.mjs
      - name: Prove authored wet ground and shipped navigation
        run: node --test test/ci/navigation-ground.test.mjs
      - name: Reach the Titan cairn and refuse unearned progress
        if: steps.ring2.outputs.play == 'true'
        run: node --test test/ci/titan-journey.test.mjs
      - name: Enter the real kurgan and resume its intro
        if: steps.ring2.outputs.play == 'true'
        run: node --test test/ci/kurgan-journey.test.mjs
      - name: Complete live-herd walk and continuation
        if: steps.ring2.outputs.play == 'true'
        run: node --test test/ci/nalati-walk.test.mjs
      - name: Cook and play only served live-herd files
        if: steps.ring2.outputs.play == 'true'
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/cook.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/cook.log"
          exit "$(cat "$RUNNER_TEMP/cook.exit")"

  # SHARD-AUTHORING SA40 (J319): generators are arbitrary Node, so build
  # every shard twice from a clean copy of the tree, each with an empty
  # HOME, and fail when the two products differ by one byte. CI only:
  # `wildshard check` does not run it.
  build-twice:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact Ring 3 candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev || github.event.client_payload.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Match the candidate engine's declared format dependency
        if: inputs.engine != '' || github.event.client_payload.engine != ''
        run: |
          node scripts/candidate-format.mjs
          pnpm install --no-frozen-lockfile --config.ci=false
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      - name: Build the shards twice and compare every product byte
        run: pnpm check:build-twice

  ci21-source:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.ci21_source == true
    runs-on: ubuntu-latest
    # Full41-root cohort includes every long native chapter/fight replay.
    # The109-case predecessor exceeded30min after30files passed; individual
    # original case/child/input/tape fences remain unchanged.
    timeout-minutes: 45
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Build and seal the ordinary pinned producer
        env:
          NALATI_ENGINE_CANDIDATE: ${{ inputs.engine || '6bab8fcc4c5949b85f47211918f1f68af15d2ed4' }}
          NALATI_JOURNEY_DIR: tmp/ci21-source
        run: |
          pnpm install --frozen-lockfile --config.ci=false
          node scripts/assert-candidate-engine.mjs --producer
          node scripts/ci21-source-product.mjs begin
          pnpm build:shards
          node scripts/ci21-source-product.mjs seal
      # Source proof currently supports an engine source candidate only.
      - name: Validate and select the exact engine source
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || '6bab8fcc4c5949b85f47211918f1f68af15d2ed4' }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev }}
        run: |
          test -n "$CANDIDATE_ENGINE"
          test -z "$CANDIDATE_SHARDDEV"
          node scripts/select-candidate.mjs
      - name: Install pinned or candidate dependency graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || '6bab8fcc4c5949b85f47211918f1f68af15d2ed4' }}
          CANDIDATE_SHARDDEV: ''
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Match the candidate engine's declared format dependency
        run: |
          node scripts/candidate-format.mjs --ci21
          pnpm install --no-frozen-lockfile --config.ci=false
      - name: Prove the installed global store
        run: node scripts/assert-store-layout.mjs
      - name: Compile, type-lint and run every complete original
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || '6bab8fcc4c5949b85f47211918f1f68af15d2ed4' }}
          NALATI_ENGINE_CANDIDATE: ${{ inputs.engine || '6bab8fcc4c5949b85f47211918f1f68af15d2ed4' }}
          NALATI_JOURNEY_DIR: tmp/ci21-source
        run: |
          test -n "$CANDIDATE_ENGINE"
          node scripts/assert-candidate-engine.mjs
          node --experimental-transform-types --test test/tooling/ci21-case-inventory.test.mjs test/tooling/ci21-source-product.test.mjs test/tooling/ci21-owned-collision.test.mjs
          pnpm check:ci21-candidate --reporter=default --reporter=json --outputFile=tmp/ci21-source/report.json
      - name: Retain actual source identity and complete case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-source-${{ github.run_id }}
          path: tmp/ci21-source/
          if-no-files-found: error
