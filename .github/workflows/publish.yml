name: publish

# SHARD-PUBLISH-ACTIONS (meta J369, J371): ship one shard revision from
# Actions, with no key on any laptop. Kit-owned (repo-kit files/): edit it
# there, never in a shard repo. From any machine or a phone:
#   gh workflow run publish.yml -R project-wildshard/shard-nalati -f channel=staging
#   (-f slug=<slug> when the repo builds more than one; -f version=X.Y.Z)
# The version is package.json's (SHARD-COMPAT CP13): bump it in the repo; a
# version that does not rise above the catalogue's is refused before upload.
# After the cook, `record` tags the commit r<revision> and commits
# published.json (version, revision, digest, channel) back to main.
# `build` gates, checks, builds and prepares with no secret in reach; only
# `upload` reads the org secrets, inside the channel's environment.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slug to publish (empty when the repo builds only one)
        type: string
        default: ''
      channel:
        description: staging moves preview and staging; prod moves all three
        type: choice
        options: [staging, prod]
        default: staging
      version:
        description: repo (package.json's version, must rise), X.Y.Z, or auto (the catalogue's patch + 1)
        type: string
        default: repo
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
      sharddev:
        description: Exact candidate sharddev commit (empty keeps the pin)
        type: string
        default: ''
      preparation:
        description: Engine release whose preparation client prepares, vX.Y.Z or server-staging-<sha> (required; empty refuses)
        type: string
        required: true
      rehearse:
        description: Run every gate, the build and prepare; never upload
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Ships of one slug run one at a time; each rehearsal has its own group,
# so a rehearsal never displaces a waiting ship.
concurrency:
  group: publish-${{ inputs.slug || github.repository }}-${{ inputs.rehearse && format('rehearse-{0}-{1}', github.ref_name, github.run_id) || 'ship' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # FR-A3: the gate waits up to 30 minutes for this commit's ci, then the slowest green build (open plots) is 43.
    timeout-minutes: 80
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      CANDIDATE_ENGINE: ${{ inputs.engine }}
      CANDIDATE_SHARDDEV: ${{ inputs.sharddev }}
    outputs:
      slug: ${{ steps.product.outputs.slug }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # A6 (build-max 2026-11-20): an empty preparation fell back to the sdk's pinned engine client, and v0.1.54's
      # stalled phone WebKit 240 s on both runners. The dispatch names the client; empty stops here, in seconds.
      - name: Refuse an empty or malformed preparation
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION: ${{ inputs.preparation }}
        run: node scripts/publish-shard.mjs preparation
      - name: Refuse anything but main's green tip
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REHEARSE: ${{ inputs.rehearse }}
        run: node scripts/publish-shard.mjs gate
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Install the pinned, or the named candidate, sdk graph
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            test -f scripts/select-candidate.mjs || { echo '::error::this repo has no scripts/select-candidate.mjs: publish its pins'; exit 1; }
            node scripts/select-candidate.mjs
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      # QA-11-23-b row 44 (J505): SDK 0.4.30 wrote a format staging's cook (v0.1.79) could not read, and the cook
      # refused two uploads about 30 minutes into each run. Before the build, refuse when a cook this channel
      # reaches can't read the format the installed SDK writes, naming the engine it needs.
      - name: Refuse a format the channel's cook can't read
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISH_REHEARSE: ${{ inputs.rehearse }}
          # QA-11-23-b row 47: and refuse a version other bytes hold (a refused upload's too) before the build.
          PUBLISH_SLUG: ${{ inputs.slug }}
          PUBLISH_VERSION: ${{ inputs.version }}
        run: node scripts/publish-preflight.mjs "${{ inputs.channel }}"
      # The phone atlases' Basis encoder is built once per host and cached
      # (S12f3). Its key names the C library: a basisu built on a newer
      # runner image (ubuntu-26.04, glibc 2.43) fails on an older one
      # (ubuntu-24.04, glibc 2.39), so their caches never mix (NET-LAG NL12).
      - name: Name the C library the Basis encoder links against
        id: libc
        run: echo "libc=$(node -p "process.report.getReport().header.glibcVersionRuntime ?? 'none'")" >> "$GITHUB_OUTPUT"
      - name: Keep the pinned Basis encoder the phone atlases need (S12f3)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/basis
          key: basis-${{ runner.os }}-${{ runner.arch }}-glibc${{ steps.libc.outputs.libc }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: basis-${{ runner.os }}-${{ runner.arch }}-glibc${{ steps.libc.outputs.libc }}-
      # As each shard repo's ci.yml does: build:shards first (its
      # publish-public step lays out public/assets), then check.
      - name: Build, and name the product
        id: product
        run: node scripts/publish-shard.mjs build "${{ inputs.slug }}"
      - name: Check the shard source as an author would
        run: pnpm exec wildshard check . tmp/publish/check
      - name: The version upload sends
        id: version
        env:
          PUBLISH_REHEARSE: ${{ inputs.rehearse }}
        run: node scripts/publish-version.mjs "${{ steps.product.outputs.slug }}" "${{ inputs.version }}"
      - name: Install phone WebKit for prepare
        run: |
          # Prepare uses the directly installed dev package or CLI's dev package.
          # Older shards still carry Playwright in the sharddev alias.
          pw="$(node --input-type=commonjs <<'JS'
          const { dirname, join } = require('node:path');
          const { existsSync, realpathSync } = require('node:fs');
          const scope = 'node_modules/@wildshard';
          const cli = join(scope, 'cli');
          const candidates = [join(scope, 'dev')];
          if (existsSync(cli)) candidates.push(join(realpathSync(cli), '..', 'dev'));
          candidates.push(join(scope, 'sharddev'));
          for (const candidate of candidates) {
            if (!existsSync(candidate)) continue;
            try {
              console.log(dirname(require.resolve('playwright/package.json', { paths: [realpathSync(candidate)] })));
              process.exit(0);
            } catch {}
          }
          console.error('cannot resolve Playwright from @wildshard/dev, @wildshard/cli, or @wildshard/sdk');
          process.exit(1);
          JS
          )"
          if [ "$RUNNER_OS" = Linux ]; then node "$pw/cli.js" install --with-deps webkit; else node "$pw/cli.js" install webkit; fi
      - name: Prepare in phone WebKit
        env:
          PRODUCT: ${{ steps.product.outputs.product }}
          # Checked by the build job's first step (A6): vX.Y.Z or server-staging-<sha>, never empty.
          PREPARATION: ${{ inputs.preparation }}
          # `gh run rerun <id> --debug` turns on the recorder's full output (NET-LAG NL12).
          WILDSHARD_PREPARATION_DEBUG: ${{ runner.debug }}
        run: |
          # The dispatch names the engine release whose preparation client prepares (SHARD-SOURCE SS-MS1c, A6).
          export WILDSHARD_PREPARATION_CLIENT_URL="https://github.com/project-wildshard/engine/releases/download/$PREPARATION/preparation-client.tar.gz"
          echo "prepare: preparation client $PREPARATION" | tee -a "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          pnpm exec wildshard prepare "$PRODUCT"
          echo "prepare: $(( $(date +%s) - start )) s on $RUNNER_OS/$RUNNER_ARCH" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write the prepared shard file
        env:
          PRODUCT: ${{ steps.product.outputs.product }}
          SLUG: ${{ steps.product.outputs.slug }}
        run: |
          pnpm exec wildshard build "$PRODUCT" "tmp/publish/$SLUG.shardfile"
          test -z "$(git status --porcelain --untracked-files=no)" || { git status --short --untracked-files=no; echo '::error::the build changed tracked files: commit what it writes'; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shardfile
          path: tmp/publish/${{ steps.product.outputs.slug }}.shardfile
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    if: ${{ !inputs.rehearse && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # Setup, transfer and the commit: the job ends at "accepted, cooking" (A6) and the cook job waits for the verdict.
    timeout-minutes: 30
    outputs:
      upload_id: ${{ steps.report.outputs.upload_id }}
      revision: ${{ steps.report.outputs.revision }}
      hash: ${{ steps.report.outputs.hash }}
      # QA-11-23-b row 45: the version the API holds the bytes as; unchanged bytes keep the version that holds them.
      version: ${{ steps.report.outputs.version }}
    environment: ${{ inputs.channel }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      CANDIDATE_ENGINE: ${{ inputs.engine }}
      CANDIDATE_SHARDDEV: ${{ inputs.sharddev }}
      SLUG: ${{ needs.build.outputs.slug }}
      VERSION: ${{ needs.build.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Install the same graph the build used
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            node scripts/select-candidate.mjs
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shardfile
          path: tmp/publish
      # The keys come from org secrets (SHARD-PUBLISH-ACTIONS SP3); Actions
      # masks them, and nothing here prints them or the account's email.
      - name: Upload
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/wildshard-agent-fetch.mjs
          WS_LANE_NAME: ci-publish
          WILDSHARD_API_URL: https://api.wildshard.io
          WILDSHARD_API_KEY: ${{ secrets.WILDSHARD_API_KEY }}
          WILDSHARD_CREATOR_PRIVATE_KEY: ${{ secrets.WILDSHARD_CREATOR_PRIVATE_KEY }}
        run: |
          test -n "$WILDSHARD_API_KEY" || { echo '::error::no WILDSHARD_API_KEY org secret reaches this repo'; exit 1; }
          set -o pipefail
          pnpm exec wildshard upload "tmp/publish/$SLUG.shardfile" --channel "$CHANNEL" --version "$VERSION" --no-wait 2>&1 | tee tmp/publish/upload.log
      - name: Accepted upload, or committed revision and grid line
        id: report
        run: node scripts/publish-shard.mjs summary "$SLUG" "$CHANNEL" tmp/publish/upload.log "tmp/publish/$SLUG.shardfile"

  # A6 (build-max 2026-11-20): Pine's cook takes 45 to 52 minutes, past the upload job's limit, which cancelled runs
  # whose cook succeeded. This job reads the API's upload status, needs no API key, and only then asks engine for the pin.
  cook:
    needs: [build, upload]
    if: ${{ needs.upload.outputs.hash != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    environment: ${{ inputs.channel }}
    outputs:
      revision: ${{ steps.report.outputs.revision }}
    env:
      SLUG: ${{ needs.build.outputs.slug }}
      CHANNEL: ${{ inputs.channel }}
      HASH: ${{ needs.upload.outputs.hash }}
      UPLOAD_ID: ${{ needs.upload.outputs.upload_id }}
      # QA-11-23-b row 50: what the follow-up's record job writes to published.json.
      VERSION: ${{ needs.upload.outputs.version || needs.build.outputs.version }}
      NIGHTLY_APP_CLIENT_ID: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
      # QA-11-23-b row 49: past the wait, hand the cook to publish-cook.yml instead of ending red.
      PUBLISH_COOK_HANDOFF: 'true'
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Wait for the cook's verdict and staging's revision
        id: report
        run: node scripts/publish-shard.mjs cook "$SLUG" "$CHANNEL" "$HASH" "$UPLOAD_ID"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: nightly
        if: env.NIGHTLY_APP_CLIENT_ID != '' && steps.report.outputs.revision != ''
        with:
          client-id: ${{ env.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: project-wildshard
          repositories: engine
          permission-contents: write
      - name: Ask engine for the pin bump
        if: steps.nightly.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.nightly.outputs.token }}
          REVISION: ${{ steps.report.outputs.revision }}
        run: |
          gh api repos/project-wildshard/engine/dispatches -f event_type=shard-published \
            -F "client_payload[slug]=$SLUG" -F "client_payload[revision]=$REVISION" \
            -F "client_payload[hash]=$HASH" -F "client_payload[channel]=$CHANNEL"
          echo "engine shard-pin dispatched for $SLUG rev $REVISION" >> "$GITHUB_STEP_SUMMARY"
      # QA-11-23-b row 49 (J505): a cook past this job's wait goes on in publish-cook.yml, which pins it on its verdict.
      - name: Hand a slow cook to publish-cook.yml
        if: steps.report.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-cook.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f slug="$SLUG" -f channel="$CHANNEL" -f hash="$HASH" -f upload_id="$UPLOAD_ID" -f hop=1 \
            -f version="$VERSION" -f built="$GITHUB_SHA"
          echo "the cook goes on in publish-cook.yml (hop 1); it asks engine for the pin on its verdict" >> "$GITHUB_STEP_SUMMARY"

  # SHARD-COMPAT CP13: the repo records what it published. The built commit gets tag r<revision> (<slug>-r<revision>
  # when r<revision> names another slug's commit) and main gets published.json. Engine's pins stop being the only record.
  record:
    needs: [build, upload, cook]
    if: ${{ needs.cook.outputs.revision != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SLUG: ${{ needs.build.outputs.slug }}
      VERSION: ${{ needs.upload.outputs.version || needs.build.outputs.version }}
      REVISION: ${{ needs.cook.outputs.revision }}
      HASH: ${{ needs.upload.outputs.hash }}
      CHANNEL: ${{ inputs.channel }}
      BUILT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Tag the built commit and commit published.json
        id: record
        run: |
          node scripts/publish-shard.mjs record "$SLUG" "$VERSION" "$REVISION" "$HASH" "$CHANNEL" "$BUILT"
          tag=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$BUILT"
            git push origin "refs/tags/$tag"
          fi
          git add published.json
          if git diff --cached --quiet; then
            echo "published.json already records $SLUG rev $REVISION"
          else
            git commit -m "chore(publish): $SLUG $VERSION r$REVISION on $CHANNEL" -m "SHARD-COMPAT CP13: recorded by publish.yml run $GITHUB_RUN_ID."
            git push origin HEAD || { git pull --rebase origin HEAD && git push origin HEAD; }
          fi
          echo "$SLUG $VERSION: tag $tag, published.json on main" >> "$GITHUB_STEP_SUMMARY"
