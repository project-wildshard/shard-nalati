name: ci21-boundary-soak
on:
  workflow_dispatch:
  schedule:
    # Daily at 03:00 Cancún; promotion remains a reviewed C10 step.
    - cron: '0 8 * * *'
permissions:
  contents: read
jobs:
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.ci=false
      - name: Observe all boundary controls without blocking production
        run: |
          mkdir -p tmp/ci21-boundary
          set +e
          pnpm test:ci21-boundary > tmp/ci21-boundary/raw.log 2>&1
          result=$?
          set -e
          cat tmp/ci21-boundary/raw.log
          printf '{"advisory":true,"exitCode":%s,"promoteAfter":"2026-11-23"}\n' "$result" > tmp/ci21-boundary/result.json
      - name: Retain every actual advisory result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-boundary-soak-${{ github.run_id }}
          path: tmp/ci21-boundary/
          if-no-files-found: error
          retention-days: 30
